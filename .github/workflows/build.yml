name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile and Package iOS IPA
        run: |
          APP_NAME="DynamicIsland"
          mkdir -p "build/Payload/$APP_NAME.app"
          
          # 1. Locate the real iPhoneOS SDK on the runner
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK at: $SDK_PATH"
          
          # 2. Compile Swift files directly for iPhone 13 (ARM64)
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -O \
            DemoContentView.swift \
            DynamicIslandApp.swift \
            DynamicIslandManager.swift \
            DynamicIslandModel.swift \
            DynamicIslandView.swift \
            NotchGeometry.swift \
            -o "build/Payload/$APP_NAME.app/$APP_NAME"
          
          # 3. Create Info.plist
          cat <<EOF > "build/Payload/$APP_NAME.app/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.dynamicisland.iphone13</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Ad-hoc codesign
          codesign -s - --force --deep "build/Payload/$APP_NAME.app"

          # 5. Create IPA archive
          cd build
          zip -qr "DynamicIsland.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-iOS-IPA
          path: build/DynamicIsland.ipa
